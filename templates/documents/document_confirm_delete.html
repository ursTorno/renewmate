{% extends "base.html" %}

{% block title %}Delete {{ document.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-5"></i>
                <h1 class="h4 mt-3">Delete this document?</h1>
                <p class="text-muted">
                    You are about to delete <strong>{{ document.title }}</strong>.
                    This action cannot be undone.
                </p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete it</button>
                    <a href="{% url 'document_detail' document.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
